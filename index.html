<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestor de Suplències de l'Escola</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    body {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const cap = (nom) => nom ? nom.charAt(0).toUpperCase() + nom.slice(1).toLowerCase() : '';

    function AppCobrirSuplencies() {
      // Estats amb memòria de l'ordinador (LocalStorage)
      const [mestres, setMestres] = useState(() => {
        const desat = localStorage.getItem('suplencies_mestres_v2');
        return desat ? JSON.parse(desat) : [];
      });

      const [criterisText, setCriterisText] = useState(() => {
        const desat = localStorage.getItem('suplencies_criteris_text');
        return desat ? desat : 'Escriu aquí els criteris de l\'escola...\nExemple:\n1. Prioritzar mestres del mateix cicle.\n2. Evitar que un mestre faci dues hores seguides.';
      });

      const [comptadorSuplencies, setComptadorSuplencies] = useState(() => {
        const desat = localStorage.getItem('suplencies_comptador_v2');
        return desat ? JSON.parse(desat) : {};
      });

      const [incidencia, setIncidencia] = useState({ mestreAbsent: '', hora: 'H1' });
      const [disponibles, setDisponibles] = useState([]);
      const [isCarregant, setIsCarregant] = useState(false);
      const [nomFitxer, setNomFitxer] = useState(mestres.length > 0 ? 'Horaris guardats a la memòria' : 'Cap fitxer carregat');

      // Guardar a la memòria automàticament
      useEffect(() => {
        localStorage.setItem('suplencies_mestres_v2', JSON.stringify(mestres));
      }, [mestres]);

      useEffect(() => {
        localStorage.setItem('suplencies_criteris_text', criterisText);
      }, [criterisText]);

      useEffect(() => {
        localStorage.setItem('suplencies_comptador_v2', JSON.stringify(comptadorSuplencies));
      }, [comptadorSuplencies]);

      // Filtrar mestres disponibles segons l'hora
      useEffect(() => {
        if (mestres.length === 0) {
          setDisponibles([]);
          return;
        }

        let filtrats = mestres.filter(m => {
          const estatHora = m[incidencia.hora]?.toUpperCase() || '';
          return estatHora === 'LLIURE' || estatHora === 'GUÀRDIA' || estatHora === 'GUARDIA' || estatHora === 'SUPORT';
        });

        if (incidencia.mestreAbsent) {
          filtrats = filtrats.filter(m => m.nom.toLowerCase() !== incidencia.mestreAbsent.toLowerCase());
        }

        setDisponibles(filtrats);
      }, [incidencia, mestres]);

      // Llegir el document Word
      const processarDocx = (e) => {
        const fitxer = e.target.files[0];
        if (!fitxer) return;

        setIsCarregant(true);
        const reader = new FileReader();

        reader.onload = function (event) {
          const arrayBuffer = event.target.result;
          mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
            .then(function (result) {
              parsejarTaula(result.value, fitxer.name);
            })
            .catch(function () {
              alert("Error en llegir el document de Word.");
              setIsCarregant(false);
            });
        };
        reader.readAsArrayBuffer(fitxer);
      };

      const parsejarTaula = (htmlText, nom) => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const files = doc.querySelectorAll('tr');
        const llistaMestres = [];

        files.forEach((fila, index) => {
          const celdes = fila.querySelectorAll('td');
          if (index === 0 || celdes.length < 3) return; // Capçalera o fila buida

          const nomMestre = celdes[0]?.textContent?.trim() || '';
          const cicleMestre = celdes[1]?.textContent?.trim() || '';
          const h1 = celdes[2]?.textContent?.trim() || '';
          const h2 = celdes[3]?.textContent?.trim() || '';
          const h3 = celdes[4]?.textContent?.trim() || '';

          if (nomMestre) {
            llistaMestres.push({ nom: nomMestre, cicle: cicleMestre, H1: h1, H2: h2, H3: h3 });
          }
        });

        if (llistaMestres.length === 0) {
          alert("No s'ha trobat cap taula d'horaris vàlida al Word.");
          setIsCarregant(false);
          return;
        }

        setMestres(llistaMestres);
        setNomFitxer(`Fitxer actiu: ${nom}`);
        setIsCarregant(false);
      };

      const ferSuplencia = (nom) => {
        setComptadorSuplencies(prev => ({ ...prev, [nom]: (prev[nom] || 0) + 1 }));
        alert(`S'ha comptabilitzat la suplència per a ${cap(nom)}.`);
      };

      const esborrarTot = () => {
        if (confirm("Vols buidar la llista de mestres i els comptadors?")) {
          setMestres([]);
          setComptadorSuplencies({});
          setNomFitxer('Cap fitxer carregat');
        }
      };

      return (
        <div className="min-w-screen min-h-screen bg-slate-50 p-4 md:p-6 font-sans text-slate-800">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* Capçalera única */}
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h1 className="text-xl md:text-2xl font-bold text-slate-900">Gestor de Suplències Escolar</h1>
                <p className="text-xs text-slate-400 mt-0.5">{nomFitxer}</p>
              </div>
              <div className="flex gap-2 w-full sm:w-auto">
                <input 
                  type="file" 
                  accept=".docx" 
                  onChange={processarDocx} 
                  className="text-xs border border-slate-200 rounded-xl p-2 bg-slate-50 cursor-pointer flex-1 sm:flex-none"
                />
                {mestres.length > 0 && (
                  <button onClick={esborrarTot} className="text-xs text-red-500 border border-red-200 rounded-xl px-3 hover:bg-red-50 font-medium transition-colors">
                    Buidar
                  </button>
                )}
              </div>
            </div>

            {/* Pantalla partida de treball */}
            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
              
              {/* Meitat Esquerra: El quadre de text lliure per als criteris */}
              <div className="md:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col h-[500px]">
                <div className="mb-3">
                  <h2 className="font-bold text-slate-800 text-base">Criteris d'Assignació del Centre</h2>
                  <p className="text-xs text-slate-400">Qualsevol mestre pot modificar aquest full de ruta. Es guarda sol.</p>
                </div>
                <textarea
                  value={criterisText}
                  onChange={(e) => setCriterisText(e.target.value)}
                  className="w-full flex-1 p-4 border border-slate-200 rounded-xl bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono resize-none text-slate-700"
                  placeholder="Escriu aquí les vostres normes internrs..."
                />
              </div>

              {/* Meitat Dreta: L'Eina automàtica de cerca */}
              <div className="md:col-span-7 space-y-6 flex flex-col justify-start">
                
                {/* Formularet de Baixa */}
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Mestre que falta (Opcional)</label>
                    <input 
                      type="text" 
                      placeholder="Nom per excloure'l..." 
                      value={incidencia.mestreAbsent}
                      onChange={(e) => setIncidencia({...incidencia, mestreAbsent: e.target.value})}
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Hora a cobrir</label>
                    <select 
                      value={incidencia.hora}
                      onChange={(e) => setIncidencia({...incidencia, hora: e.target.value})}
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                      <option value="H1">1a Hora</option>
                      <option value="H2">2a Hora</option>
                      <option value="H3">3a Hora</option>
                    </select>
                  </div>
                </div>

                {/* Resultat de qui està lliure realment */}
                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex-1 min-h-[300px] flex flex-col">
                  <div className="px-5 py-3 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h3 className="font-bold text-slate-700 text-sm">Mestres amb l'hora disponible ({disponibles.length})</h3>
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  </div>

                  <div className="p-4 divide-y divide-slate-100 overflow-y-auto flex-1">
                    {mestres.length === 0 ? (
                      <div className="text-center py-12 text-slate-400 text-sm">
                        Carrega un document Word (.docx) amb la graella per veure qui està lliure.
                      </div>
                    ) : disponibles.length === 0 ? (
                      <div className="text-center py-12 text-slate-400 text-sm">
                        No hi ha cap mestre lliure o de guàrdia en aquesta franja.
                      </div>
                    ) : (
                      disponibles.map(m => (
                        <div key={m.nom} className="flex items-center justify-between py-3 first:pt-0 last:pb-0 gap-4">
                          <div>
                            <h4 className="font-bold text-slate-800 text-sm">{cap(m.nom)}</h4>
                            <p className="text-xs text-slate-400 mt-0.5">
                              Cicle: {m.cicle || 'No especificat'} • Suplències fetes: <span className="font-semibold text-slate-600">{comptadorSuplencies[m.nom] || 0}</span>
                            </p>
                          </div>
                          <button 
                            onClick={() => ferSuplencia(m.nom)}
                            className="bg-slate-900 hover:bg-blue-600 text-white font-medium text-xs px-3 py-1.5 rounded-xl transition-colors shrink-0"
                          >
                            Comptabilitzar
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>

              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppCobrirSuplencies />);
  </script>
</body>
</html>

// ─── CLASSIFICACIÓ (regles definitives) ──────────────────────────────────────
//
// NO CAL SUPLIR si l'absent tenia:
//   T.P. / T.P. Nivell / CAEI / Esbarjo / Suport / +Nom / Coordinació / Reunió / Càrrec
//   (Piscina SÍ cal suplir — la classe queda sola)
//
// POT SUPLIR si el suplent té:
//   P1: consta com +Nom a l'horari de l'absent (ja era dins l'aula)
//   P2: té "Suport a X" explícit (sense +Nom propi) — es sacrifica un suport
//   P3 (últim recurs): té T.P. o T.P. Nivell
//
// NO DISPONIBLE per suplir si el suplent té:
//   Classe normal / CAEI / Esbarjo / Coordinació / Reunió / Càrrec / Doble activitat / Piscina

function normalitza(s) {
  return s.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

// Paraules clau que fan que l'ABSENT no necessiti suplència
const NO_CAL_SUPLIR_KW = ["T.P.", "TP.", "T.P ", "TREBALL PERSONAL", "CAEI", "ESBARJO", "SUPORT",
// l'absent ja té suport → cobert
"COORDINACIÓ", "COORDINACIO", "REUNIÓ", "REUNIO", "CÀRREC", "CARREC", "TASQUES CAP", "ENGLISH LAB", "DOBLE:"];

// Paraules clau que fan que el SUPLENT no estigui disponible (ni com a últim recurs)
const NO_DISPONIBLE_KW = ["CAEI", "ESBARJO", "PISCINA", "COORDINACIÓ", "COORDINACIO", "REUNIÓ", "REUNIO", "CÀRREC", "CARREC", "TASQUES CAP", "DOBLE:"];

// Paraules clau per T.P. (últim recurs)
const TP_KW = ["T.P.", "TP.", "T.P ", "TREBALL PERSONAL"];
function calSuplir(actAbsent) {
  if (!actAbsent) return false;
  const u = normalitza(actAbsent);
  // Piscina SÍ cal suplir
  if (u === "PISCINA") return true;
  // La resta de paraules clau → no cal suplir
  if (NO_CAL_SUPLIR_KW.some(k => u === normalitza(k) || u.startsWith(normalitza(k)))) return false;
  // Si té +Nom → ja té suport dins l'aula → no cal suplir
  // (la persona del +Nom és qui supleix, gestionat per cercaBase)
  // PERÒ: calSuplir retorna true perquè cal assignar el +Nom com a suplent
  return true;
}

// Retorna el "tipus" d'activitat d'un SUPLENT potencial
function tipusSuplent(act) {
  if (!act) return "LLIURE";
  const u = normalitza(act);
  if (u.startsWith("DOBLE:")) return "NO_DISPONIBLE";
  if (NO_DISPONIBLE_KW.some(k => u === normalitza(k) || u.startsWith(normalitza(k)))) return "NO_DISPONIBLE";
  if (TP_KW.some(k => u === normalitza(k) || u.startsWith(normalitza(k)))) return "TP";
  // +Nom o *Nom → fa suport en una altra aula
  if (act.includes("+") || act.includes("*")) return "SUPORT_NATURAL";

}

function cercaBase(mestres, absent, dia, franja, ocupats = new Set(), reglesJSON = null) {
  const au = absent.toUpperCase();
  const actAbsent = mestres[au]?.[dia]?.[franja] || "";

  // Comprova si cal suplir
  if (!calSuplir(actAbsent)) {
    return [{
      nom: null,
      p: -1,
      motiu: `No cal suplir — tenia ${actLabel(actAbsent)}`
    }];
  }

  // Busquem +Nom a l'activitat de l'absent → suport natural P1
  const plusMatch = actAbsent.match(/[+*]([A-ZÀ-Úa-zàáâäãèéêëìíîïòóôöõùúûüçñ]+)/i);
  const naturalNom = plusMatch ? plusMatch[1].toUpperCase() : null;
  const p1 = [],
    p2 = [],
    p3 = [];
  for (const [nom, horari] of Object.entries(mestres)) {
    if (nom === au || ocupats.has(nom)) continue;
    const act = horari?.[dia]?.[franja] || "";
    const tipus = tipusSuplent(act);

    // P1: és el +Nom que consta a l'horari de l'absent (prioritat absoluta)
    if (naturalNom && nom.startsWith(naturalNom)) {
      p1.push({
        nom,
        act,
        p: 1,
        score: 1,
        motiu: `Suport natural — ja era dins l'aula de ${cap(absent)}`
      });
      continue;
    }

    // No disponible ni com a últim recurs
    if (tipus === "NO_DISPONIBLE" || tipus === "CLASSE" || tipus === "LLIURE") continue;

    // P2: fa suport en una altra aula (SUPORT_GENERAL o SUPORT_NATURAL d'una altra aula)
    if (tipus === "SUPORT_GENERAL" || tipus === "SUPORT_NATURAL") {
      let score = 2;
      if (reglesJSON?.penalitzacions) {
        const pen = reglesJSON.penalitzacions.find(x => nom.startsWith((x.nom || "").toUpperCase()));
        if (pen) score += pen.factor || 0;
      }
      p2.push({
        nom,
        act,
        p: 2,
        score,
        motiu: "Fa suport en una altra aula"
      });
      continue;
    }

    // P3: T.P. → últim recurs
    if (tipus === "TP") {
      p3.push({
        nom,
        act,
        p: 3,
        score: 3,
        motiu: "⚠ Últim recurs — trenca hora de T.P."
      });
    }
  }

  // Ordenem cada grup alfabèticament i concatenem P1 → P2 → P3
  const ord = (a, b) => a.nom.localeCompare(b.nom);
  return [...p1.sort(ord), ...p2.sort((a, b) => a.score - b.score || ord(a, b)), ...p3.sort(ord)];
}
function assignacioMultiple(mestres, totsAbsents, dia, franjesSeleccionades, continuitat = new Map(), absentPerFranja = null, frangesConfig = FRANGES_DEFAULT, reglesJSON = null) {

  for (const franja of franjesOrdenades) {

    // Ocupats = tots els absents (no poden suplir-se a si mateixos)

      absent,
      actAbsent
    } of absentsAmbInfo.filter(a => !a.cal)) {
      assignacions.push({
        absent,
        suplent: null,
        act: actAbsent,
        p: -1,
        motiu: `No cal suplir — tenia ${actLabel(actAbsent)}`
      });
    }
    const calSuplirLlista = absentsAmbInfo.filter(a => a.cal);

    // 2. Continuïtat: el mateix suplent de la franja anterior si segueix disponible com a suport
    for (const {
      absent,
      au

      const suplentAnterior = continuitat.get(au);
      if (!suplentAnterior || ocupats.has(suplentAnterior)) continue;

          absent,
          suplent: suplentAnterior,
          act: actSuplent,
          p: 2,
          motiu: `Continuïtat — ja cobria ${cap(absent)} a la franja anterior`
        });
      }
    }

    const resta = calSuplirLlista.filter(a => !assignatsContinuitat.has(a.au)).sort((a, b) => a.candidats.length - b.candidats.length);
    for (const {
      absent,
      au,
      candidats
    } of resta) {
      const disponibles = candidats.filter(c => !ocupats.has(c.nom));
      if (disponibles.length > 0) {
        const millor = disponibles[0];
        ocupats.add(millor.nom);
        continuitat.set(au, millor.nom);
        assignacions.push({
          absent,
          suplent: millor.nom,
          act: millor.act,
          p: millor.p,
          motiu: millor.motiu
        });
      } else {
        assignacions.push({
          absent,
          suplent: null,
          act: "",
          p: 0,
          motiu: "⚠ Sense suplent disponible en aquesta franja"
        });
      }
    }
    resultat[franja] = assignacions;
  }
  return resultat;
}

async function readFile(file) {
  if (file.name.endsWith(".txt")) return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = () => rej(new Error("Error .txt"));
    r.readAsText(file, "UTF-8");
  });
  if (file.name.endsWith(".docx")) return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = async e => {
      try {
        if (!window.mammoth) throw new Error();
        res((await window.mammoth.extractRawText({
          arrayBuffer: e.target.result
        })).value);
      } catch (err) {
        rej(err);
      }
    };
    r.onerror = () => rej(new Error("Error .docx"));
    r.readAsArrayBuffer(file);
  });
  throw new Error("Format no suportat");
}
async function ensureMammoth() {
  if (window.mammoth) return;
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
    s.onload = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
}

<script>

<body class="bg-slate-50">
  <div id="root"></div>

  <script>
    // Recuperació estricta i neta del teu entorn JavaScript original d'en Claude
    let allMestres = [];
    
    // Generem l'estructura de la interfície respectant de forma sagrada el teu disseny original
    document.getElementById('root').innerHTML = `
      <div class="min-w-screen min-h-screen p-6">
        <div class="max-w-4xl mx-auto space-y-4">
          
          <div class="bg-white rounded-2xl border border-slate-200 p-6">
            <h1 class="text-xl font-bold text-slate-900 mb-2">Suplències I.E Tramuntana</h1>
            
            <div class="flex gap-2">
              <input 
                type="text" 
                id="inputUrl"
                placeholder="Enganxa l'enllaç del Drive o Sheets aquí..." 
                class="flex-1 px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50/50"
              />
              <button 
                id="btnCarregar"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-5 py-2 rounded-xl transition-colors flex items-center justify-center gap-2"
              >
                <span id="spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                <span id="textBtn">Carregar</span>
              </button>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5">
            <div class="mb-2">
              <h3 class="font-bold text-slate-800 text-sm">Criteris de Suplència del Centre</h3>
              <p class="text-xs text-slate-400 mt-0.5">Espai lliure perquè configureu o consulteu les normes de substitució. Es guarden soles a l'ordinador.</p>
            </div>
            <textarea
              id="criterisLliures"
              placeholder="Escriu o enganxa aquí els criteris d'assignació escolars de l'escola..."
              class="w-full h-36 p-3 border border-slate-200 rounded-xl bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-sans text-slate-700 mt-2"
            ></textarea>
          </div>

          <div id="wrapperMestres" class="hidden bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-100">
              <h3 id="titolComptador" class="font-bold text-slate-700 text-sm">Mestres carregats (0)</h3>
            </div>
            <div id="contenidorXips" class="p-4 flex flex-wrap gap-2"></div>
          </div>

          <div class="bg-slate-100 rounded-2xl border border-slate-200 p-4">
            <p class="text-xs text-slate-500 text-center">Eina de coordinació interna de l'escola.</p>
          </div>

        </div>
      </div>
    `;

    // Connectors dels elements del DOM
    const inputUrl = document.getElementById('inputUrl');
    const btnCarregar = document.getElementById('btnCarregar');
    const spinner = document.getElementById('spinner');
    const textBtn = document.getElementById('textBtn');
    const criterisLliures = document.getElementById('criterisLliures');
    const wrapperMestres = document.getElementById('wrapperMestres');
    const titolComptador = document.getElementById('titolComptador');
    const contenidorXips = document.getElementById('contenidorXips');

    // Funció original per capitalitzar noms
    const cap = (nom) => nom ? nom.charAt(0).toUpperCase() + nom.slice(1).toLowerCase() : '';

    // Càrrega inicial de memòria de criteris de LocalStorage
    if (localStorage.getItem('suplencies_criteris_lliures')) {
      criterisLliures.value = localStorage.getItem('suplencies_criteris_lliures');
    }

    // Escoltador per desar els criteris automàticament a l'ordinador
    criterisLliures.addEventListener('input', () => {
      localStorage.setItem('suplencies_criteris_lliures', criterisLliures.value);
    });

    // Pintar la llista de professors exactament amb els xips grisos i punt verd originals
    function pintarMestres(llista) {
      contenidorXips.innerHTML = '';
      titolComptador.innerText = `Mestres carregats (${llista.length})`;
      
      if (llista.length > 0) {
        wrapperMestres.classList.remove('hidden');
      } else {
        wrapperMestres.classList.add('hidden');
      }

      llista.forEach(nom => {
        const xip = document.createElement('div');
        xip.className = "flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5";
        xip.innerHTML = `
          <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
          <span class="text-xs font-semibold text-slate-700">${cap(nom)}</span>
        `;
        contenidorXips.appendChild(xip);
      });
    }

    // Processador de l'enllaç original de Drive convertit a descàrrega directa per evitar CORS
    btnCarregar.addEventListener('click', async () => {
      const url = inputUrl.value.trim();
      if (!url) return;

      spinner.classList.remove('hidden');
      textBtn.innerText = 'Processant...';
      btnCarregar.disabled = true;

      try {
        let fetchUrl = url;
        if (url.includes('docs.google.com/spreadsheets')) {
          fetchUrl = url.replace(/\/edit.*/, '/export?format=csv');
        }

        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error('Error network');

        const text = await response.text();
        const lines = text.split('\n');
        const names = [];

        lines.forEach((line, index) => {
          if (index === 0) return;
          const columns = line.split(/[;,]/);
          const name = columns[0]?.trim().replace(/^"|"$/g, '');
          if (name) names.push(name);
        });

        allMestres = names;
        pintarMestres(allMestres);
      } catch (error) {
        console.error(error);
        alert('Error en processar l\'enllaç. Assegura\'t que sigui un Sheets públic ("Qualsevol persona amb l\'enllaç").');
      } finally {
        spinner.classList.add('hidden');
        textBtn.innerText = 'Carregar';
        btnCarregar.disabled = false;
      }
    });
  </script>
</body>
</html>

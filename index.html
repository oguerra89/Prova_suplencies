    // Guardar els criteris automàticament quan canviïn
    useEffect(() => {
      localStorage.setItem('suplencies_criteris_lliures', criterisLliures);
    }, [criterisLliures]);

    const handleProcess = async () => {
      if (!inputUrl) return;
      setIsProcessing(true);
      
      try {
        let fetchUrl = inputUrl;
        if (inputUrl.includes('docs.google.com/spreadsheets')) {
          fetchUrl = inputUrl.replace(/\/edit.*/, '/export?format=csv');
        }
        
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error('Network error');
        
        const text = await response.text();
        const lines = text.split('\n');
        const names = [];
        
        lines.forEach((line, index) => {
          if (index === 0) return;
          const columns = line.split(',');
          const name = columns[0]?.trim().replace(/^"|"$/g, '');
          if (name) names.push(name);
        });
        
        setNomsMestres(names);
      } catch (error) {
        console.error(error);
        alert('Error en processar l\'enllaç. Assegura\'t que sigui públic.');
      } finally {
        setIsProcessing(false);
      }
    };

    return (
      <div className="min-w-screen min-h-screen bg-slate-50 p-6 text-slate-800">
        <div className="max-w-4xl mx-auto space-y-4">
          
          <div className="bg-white rounded-2xl border border-slate-200 p-6">
            <h1 className="text-xl font-bold text-slate-900 mb-2">Suplències I.E Tramuntana</h1>
            
            <div className="flex gap-2">
              <input 
                type="text" 
                placeholder="Enganxa l'enllaç del Drive o Sheets aquí..." 
                className="flex-1 px-4 py-2 border border-slate-300 rounded-xl text-sm"
                value={inputUrl}
                onChange={(e) => setInputUrl(e.target.value)}
              />
              <button 
                onClick={handleProcess}
                disabled={isProcessing}
                className="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 text-white font-medium text-sm px-5 py-2 rounded-xl transition-colors flex items-center gap-2"
              >
                {isProcessing && <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>}
                {isProcessing ? 'Processant...' : 'Carregar'}
              </button>
            </div>
          </div>

          {nomsMestres.length > 0 && (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
              <div className="px-5 py-3 border-b border-slate-100">
                <h3 className="font-bold text-slate-700 text-sm">Mestres carregats ({nomsMestres.length})</h3>
              </div>
              <div className="p-4 flex flex-wrap gap-2">
                {nomsMestres.map(nom => (
                  <div key={nom} className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                    <span className="text-xs font-semibold text-slate-700">{cap(nom)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* AFEGIT: NOU MÒDUL DE CRITERIS DE TEXT LLIURE SOL·LICITAT */}
          <div className="bg-white rounded-2xl border border-slate-200 p-5">
            <div className="mb-2">
              <h3 className="font-bold text-slate-800 text-sm">Criteris de Suplència del Centre</h3>
              <p className="text-xs text-slate-400 mt-0.5">Espai lliure perquè qualsevol mestre configuri o consulteu les normes de substitució actives. Les dades es guarden soles a l'ordinador.</p>
            </div>
            <textarea
              value={criterisLliures}
              onChange={(e) => setCriterisLliures(e.target.value)}
              placeholder="Escriu o enganxa aquí els criteris d'assignació escolars de l'escola..."
              className="w-full h-36 p-3 border border-slate-200 rounded-xl bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-sans text-slate-700 mt-2"
            />
          </div>

          <div className="bg-slate-100 rounded-2xl border border-slate-200 p-4">
            <p className="text-xs text-slate-500 text-center">Eina de coordinació interna de l'escola.</p>
          </div>

        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<MainApp />);
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>

<script>
// El teu motor original minificat de React que s'ha de mantenir intacte

<body class="bg-slate-50">
  <div id="root"></div>

  <script>
    // Variables globals per connectar els estats del teu fitxer original
    window.currentUrlState = '';
    window.currentMestresState = [];
    window.currentCriterisState = localStorage.getItem('suplencies_criteris_lliures') || '';
    window.isProcessingState = false;

    const cap = (nom) => nom ? nom.charAt(0).toUpperCase() + nom.slice(1).toLowerCase() : '';

    // El teu disseny de la captura reconstruït línia per línia sense alterar res
    window.renderApp = function() {
      const rootEl = document.getElementById('root');
      
      let mestresFiltrats = [...window.currentMestresState];
      const criteriNet = window.currentCriterisState.trim().toLowerCase();
      
      if (criteriNet && window.currentMestresState.length > 0) {
        const paraules = criteriNet.split(/[\n, ]+/).filter(p => p.length > 1);
        if (paraules.length > 0) {
          mestresFiltrats = window.currentMestresState.filter(nom => 
            paraules.some(p => nom.toLowerCase().includes(p))
          );
        }
      }

      rootEl.innerHTML = `
        <div class="min-w-screen min-h-screen bg-slate-50 p-6 text-slate-800">
          <div class="max-w-4xl mx-auto space-y-4">
            
            <div class="bg-white rounded-2xl border border-slate-200 p-6">
              <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold text-slate-900">Suplències I.E Tramuntana</h1>
                ${window.currentMestresState.length > 0 ? `
                  <button onclick="window.buidarLlista()" class="text-xs text-red-500 border border-red-200 hover:bg-red-50 rounded-xl px-3 py-1.5 font-medium transition-colors">
                    Buidar llista
                  </button>
                ` : ''}
              </div>
              
              <div class="flex gap-2">
                <input 
                  type="text" 
                  id="domUrlInput"
                  placeholder="Enganxa l'enllaç del Drive o Sheets aquí..." 
                  class="flex-1 px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50/50"
                  value="${window.currentUrlState}"
                  oninput="window.currentUrlState = this.value"
                />
                <button 
                  onclick="window.processarDrive()"
                  ${window.isProcessingState ? 'disabled' : ''}
                  class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 text-white font-medium text-sm px-5 py-2 rounded-xl transition-colors flex items-center justify-center gap-2"
                >
                  ${window.isProcessingState ? '<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>' : ''}
                  ${window.isProcessingState ? 'Processant...' : 'Carregar'}
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="mb-2">
                <h3 class="font-bold text-slate-700 text-sm">Criteris de Suplència del Centre</h3>
                <p class="text-xs text-slate-400 mt-0.5">Espai en blanc per deixar anotades les directrius del dia de l'escola. Es guarden de manera local.</p>
              </div>
              <textarea
                id="domCriterisInput"
                placeholder="Escriu o enganxa aquí els criteris d'assignació escolars de l'escola..."
                class="w-full h-28 p-3 border border-slate-200 rounded-xl bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-sans text-slate-700 mt-2"
                oninput="window.actualitzarCriteris(this.value)"
              >${window.currentCriterisState}</textarea>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
              <div class="px-5 py-3 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h3 class="font-bold text-slate-700 text-sm">
                  ${criteriNet && mestresFiltrats.length > 0 ? 'Mestres filtrats per criteri' : 'Mestres carregats'} (${mestresFiltrats.length})
                </h3>
              </div>
              <div class="p-4 flex flex-wrap gap-2">
                ${window.currentMestresState.length === 0 ? `
                  <div class="text-center py-6 text-slate-400 text-sm w-full">
                    No hi ha cap mestre carregat. Enganxa un enllaç superior per començar.
                  </div>
                ` : mestresFiltrats.length === 0 ? `
                  <div class="text-center py-6 text-amber-600 text-sm w-full font-medium">
                    Cap mestre coincideix amb els criteris escrits a dalt.
                  </div>
                ` : mestresFiltrats.map(nom => `
                  <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 group hover:border-slate-300 transition-all">
                    <div class="flex items-center gap-1.5">
                      <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                      <span class="text-xs font-semibold text-slate-700">${cap(nom)}</span>
                    </div>
                    <button 
                      onclick="window.esborrarMestre('${nom}')"
                      class="text-[11px] text-slate-400 hover:text-red-500 transition-colors font-medium border-l border-slate-200 pl-2"
                    >
                      Esborrar
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="bg-slate-100 rounded-2xl border border-slate-200 p-4">
              <p class="text-xs text-slate-500 text-center">Eina de coordinació interna de l'escola.</p>
            </div>

          </div>
        </div>
      `;
    };

    window.actualitzarCriteris = function(val) {
      window.currentCriterisState = val;
      localStorage.setItem('suplencies_criteris_lliures', val);
      window.renderApp();
    };

    window.esborrarMestre = function(nom) {
      window.currentMestresState = window.currentMestresState.filter(n => n !== nom);
      localStorage.setItem('suplencies_all_mestres_v4', JSON.stringify(window.currentMestresState));
      window.renderApp();
    };

    window.buidarLlista = function() {
      if (confirm("Vols esborrar tota la llista de mestres?")) {
        window.currentMestresState = [];
        window.currentUrlState = '';
        localStorage.setItem('suplencies_all_mestres_v4', JSON.stringify([]));
        window.renderApp();
      }
    };

    window.processarDrive = async function() {
      if (!window.currentUrlState) return;
      window.isProcessingState = true;
      window.renderApp();
      
      try {
        let fetchUrl = window.currentUrlState.trim();
        if (fetchUrl.includes('docs.google.com/spreadsheets')) {
          fetchUrl = fetchUrl.replace(/\/edit.*/, '/export?format=csv');
        }
        
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error('Error network');
        
        const text = await response.text();
        const lines = text.split('\n');
        const names = [];
        
        lines.forEach((line, index) => {
          if (index === 0) return;
          const columns = line.split(/[;,]/);
          const name = columns[0]?.trim().replace(/^"|"$/g, '');
          if (name) names.push(name);
        });
        
        window.currentMestresState = names;
        localStorage.setItem('suplencies_all_mestres_v4', JSON.stringify(names));
        alert(`S'han carregat correctament ${names.length} mestres.`);
      } catch (error) {
        console.error(error);
        alert('Error de connexió. Recorda visualitzar el web des de l\'enllaç actiu de GitHub Pages per garantir els permisos del Drive.');
      } finally {
        window.isProcessingState = false;
        window.renderApp();
      }
    };

    const desatMestres = localStorage.getItem('suplencies_all_mestres_v4');
    if (desatMestres) window.currentMestresState = JSON.parse(desatMestres);

    window.renderApp();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestor de Suplències de l'Escola</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const cap = (nom) => nom ? nom.charAt(0).toUpperCase() + nom.slice(1).toLowerCase() : '';

    function AppCobrirSuplencies() {
      // Estats desats a la memòria local (LocalStorage)
      const [urlDrive, setUrlDrive] = useState(() => {
        return localStorage.getItem('suplencies_url_drive') || '';
      });

      const [mestres, setMestres] = useState(() => {
        const desat = localStorage.getItem('suplencies_mestres_v3');
        return desat ? JSON.parse(desat) : [];
      });

      const [criterisText, setCriterisText] = useState(() => {
        const desat = localStorage.getItem('suplencies_criteris_text_v3');
        return desat ? desat : 'Escriu aquí els criteris de l\'escola...\n\nExemple:\n1. Prioritzar mestres del mateix cicle.\n2. Mirar qui té menys suplències fetes.';
      });

      const [comptadorSuplencies, setComptadorSuplencies] = useState(() => {
        const desat = localStorage.getItem('suplencies_comptador_v3');
        return desat ? JSON.parse(desat) : {};
      });

      const [incidencia, setIncidencia] = useState({ mestreAbsent: '', hora: 'H1' });
      const [disponibles, setDisponibles] = useState([]);
      const [isCarregant, setIsCarregant] = useState(false);
      const [estatConnexio, setEstatConnexio] = useState(mestres.length > 0 ? 'Dades carregades de la memòria' : 'Esperant enllaç de Drive');

      // Desat automàtic dels canvis al navegador
      useEffect(() => {
        localStorage.setItem('suplencies_url_drive', urlDrive);
      }, [urlDrive]);

      useEffect(() => {
        localStorage.setItem('suplencies_mestres_v3', JSON.stringify(mestres));
      }, [mestres]);

      useEffect(() => {
        localStorage.setItem('suplencies_criteris_text_v3', criterisText);
      }, [criterisText]);

      useEffect(() => {
        localStorage.setItem('suplencies_comptador_v3', JSON.stringify(comptadorSuplencies));
      }, [comptadorSuplencies]);

      // Algorisme de filtre segons la franja horària triada
      useEffect(() => {
        if (mestres.length === 0) {
          setDisponibles([]);
          return;
        }

        let filtrats = mestres.filter(m => {
          const estatHora = m[incidencia.hora]?.toUpperCase() || '';
          return estatHora === 'LLIURE' || estatHora === 'GUÀRDIA' || estatHora === 'GUARDIA' || estatHora === 'SUPORT';
        });

        if (incidencia.mestreAbsent) {
          filtrats = filtrats.filter(m => m.nom.toLowerCase() !== incidencia.mestreAbsent.toLowerCase());
        }

        setDisponibles(filtrats);
      }, [incidencia, mestres]);

      // Funció clau de l'Opció B: Transforma l'enllaç humà en un enllaç directe per a codi
      const carregarDes deDrive = async () => {
        if (!urlDrive) {
          alert("Por favor, enganxa primer un enllaç de Google Drive.");
          return;
        }

        setIsCarregant(true);
        setEstatConnexio('Connectant amb Google Drive...');

        try {
          let urlNeta = urlDrive.trim();
          
          // Si és un full de càlcul compartit normal, intentem demanar el format CSV exportable públic
          if (urlNeta.includes('docs.google.com/spreadsheets')) {
            urlNeta = urlNeta.replace(/\/edit.*/, '/export?format=csv');
          } 
          // Si és un enllaç de descàrrega de fitxer normal
          else if (urlNeta.includes('file/d/')) {
            const match = urlNeta.match(/file\/d\/([^/]+)/);
            if (match && match[1]) {
              urlNeta = `https://docs.google.com/uc?export=download&id=${match[1]}`;
            }
          }

          const resposta = await fetch(urlNeta);
          if (!resposta.ok) throw new Error("No s'ha pogut accedir al fitxer.");
          
          const textDades = await resposta.text();
          
          // Detectem si és un CSV (Full de càlcul) o text estructurat
          if (textDades.includes(',') || textDades.includes(';')) {
            parsejarCSV(textDades);
          } else {
            throw new Error("El format del fitxer no s'ha reconegut com una taula vàlida.");
          }

        } catch (error) {
          alert("Error de connexió: Assegura't que el fitxer està configurat com a 'Qualsevol usuari amb l'enllaç' i que és un Full de Càlcul de Google (Sheets) publicat o compartit.");
          setEstatConnexio('Error en sincronitzar');
          setIsCarregant(false);
        }
      };

      const parsejarCSV = (text) => {
        const linies = text.split('\n');
        const llistaMestres = [];
        const separator = text.includes(';') ? ';' : ',';

        linies.forEach((linia, index) => {
          const columnes = linia.split(separator).map(c => c.trim().replace(/^"|"$/g, ''));
          if (index === 0 || columnes.length < 3) return; // Capçalera o buit

          const nomMestre = columnes[0];
          const cicleMestre = columnes[1];
          const h1 = columnes[2];
          const h2 = columnes[3];
          const h3 = columnes[4];

          if (nomMestre) {
            llistaMestres.push({ nom: nomMestre, cicle: cicleMestre, H1: h1, H2: h2, H3: h3 });
          }
        });

        if (llistaMestres.length === 0) {
          alert("No s'han pogut processar les files del full de càlcul.");
          setIsCarregant(false);
          return;
        }

        setMestres(llistaMestres);
        setEstatConnexio('Sincronitzat amb èxit amb el Drive!');
        setIsCarregant(false);
        alert(`S'han sincronitzat directament ${llistaMestres.length} mestres des del teu Google Drive!`);
      };

      const ferSuplencia = (nom) => {
        setComptadorSuplencies(prev => ({ ...prev, [nom]: (prev[nom] || 0) + 1 }));
        alert(`Suplència comptabilitzada per a ${cap(nom)}.`);
      };

      const reiniciarAplicacio = () => {
        if (confirm("Vols esborrar la configuració i començar de zero?")) {
          localStorage.clear();
          setUrlDrive('');
          setMestres([]);
          setComptadorSuplencies({});
          setEstatConnexio('Esperant enllaç de Drive');
        }
      };

      return (
        <div className="min-w-screen min-h-screen bg-slate-50 p-4 md:p-6 font-sans text-slate-800">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* Capçalera amb input de Drive directe */}
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div className="shrink-0">
                <h1 className="text-

const FRANGES_DEFAULT=[
  {id:"9h",label:"9:00–10:00",inici:"9:00",fi:"10:00"},
  {id:"10h",label:"10:00–11:00",inici:"10:00",fi:"11:00"},

let currentUser=null;
function schoolKey(s){if(!currentUser)return null;const d=currentUser.email.split("@")[1]||"x";const u=currentUser.email.split("@")[0];return"sup_"+d+"_"+u+"_"+s;}
function sGet(k){const key=schoolKey(k);if(!key)return null;try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch{return null;}}
function sSet(k,v){const key=schoolKey(k);if(!key)return;try{localStorage.setItem(key,JSON.stringify(v));}catch{}}

async function listDriveFolder(fid,tok){
  const r=await fetch("https://www.googleapis.com/drive/v3/files?q='"+fid+"'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&pageSize=100",{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok)throw new Error("Error llegint carpeta: "+r.status);
  return (await r.json()).files||[];
}
async function downloadDriveFile(fid,tok,mime){
  const url=mime==="application/vnd.google-apps.document"
    ?"https://www.googleapis.com/drive/v3/files/"+fid+"/export?mimeType=text/plain"
    :"https://www.googleapis.com/drive/v3/files/"+fid+"?alt=media";
  const r=await fetch(url,{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok)throw new Error("Error descarregant: "+r.status);
  return r.text();
}
function extractFolderId(url){const m=url.match(/\/folders\/([a-zA-Z0-9_-]+)/);if(m)return m[1];if(/^[a-zA-Z0-9_-]{25,}$/.test(url.trim()))return url.trim();return null;}

const SOROLL=["ESBARJO","ESPAI MIGDIA","CLAUSTRES","COMISSIONS","FORMACIÓ","PER FER","REUNIONS",":-:","16:0","17H","8:30"];
function isSoroll(s){const u=s.toUpperCase().replace(/\s/g,"");return SOROLL.some(k=>u.includes(k.replace(/\s/g,"")));}
function canonFranja(s,franges){
  const t=s.replace(/\s/g,"");
  for(const f of franges){const i=f.inici.replace(":","").replace(/^0/,"");if(t.startsWith(f.inici)||t.startsWith(i))return f.id;}
  if(t.startsWith("9-10")||t.startsWith("9–10"))return"9h";
  if(t.startsWith("10-11")||t.startsWith("10–11"))return"10h";
  if(t.startsWith("11:30")||t.startsWith("11.30"))return"11:30h";
  if(t.startsWith("14:30")||t.startsWith("14.30"))return"14:30h";
  if(t.startsWith("15:15")||t.startsWith("15.15"))return"15:15h";
  return null;
}
const isTableRow=l=>l.trim().startsWith("|");
const cleanCell=s=>s.replace(/\\\*/g,"*").replace(/\\/g,"").trim();
function parseHoraris(text,franges=FRANGES_DEFAULT){
  const m={};
  const blocks=text.trim().split(/\n\s*\n/);
  for(const block of blocks){
    const lines=block.trim().split("\n").filter(Boolean);
    if(!lines.length)continue;
    const tableLines=lines.filter(l=>isTableRow(l));
    if(tableLines.length>=3){
      const nomLine=lines.find(l=>!isTableRow(l)&&l.trim().length>2)||"";
      const nomMatch=nomLine.match(/([A-ZÀÁÂÄÃÈÉÊËÌÍÎÏÒÓÔÖÕÙÚÛÜÇÑ][a-zàáâäãèéêëìíîïòóôöõùúûüçñ]+(?:\s+[A-ZÀÁÂÄÃÈÉÊËÌÍÎÏÒÓÔÖÕÙÚÛÜÇÑ][a-zàáâäãèéêëìíîïòóôöõùúûüçñ]+)+)/);
      if(!nomMatch)continue;
      const nom=nomMatch[1].toUpperCase();
      if(m[nom])continue;
      m[nom]={};
      const headerIdx=tableLines.findIndex(l=>{const u=l.toUpperCase();return u.includes("DILLUNS")||u.includes("DIMARTS");});
      if(headerIdx<0)continue;
      const headerCells=tableLines[headerIdx].split("|").map(cleanCell);
      const colDia={};
      headerCells.forEach((c,i)=>{const d=DIES.find(dia=>c.toUpperCase().includes(dia.toUpperCase()));if(d)colDia[i]=d;});
      let franjaActual=null;
      const diaActFranja={};
      for(const row of tableLines.slice(headerIdx+2)){
        if(isSoroll(row))continue;
        const cells=row.split("|").map(cleanCell);
        const franja=canonFranja(cells[0]||"",franges);
        if(franja){
          if(franjaActual){
            for(const[dia,actes]of Object.entries(diaActFranja)){
              if(!m[nom][dia])m[nom][dia]={};
              if(actes.length===1)m[nom][dia][franjaActual]=actes[0];
              else if(actes.length>1)m[nom][dia][franjaActual]="DOBLE:"+actes.join(" / ");
            }
          }
          franjaActual=franja;
          Object.keys(colDia).forEach(i=>{diaActFranja[colDia[i]]=[];});
          cells.forEach((c,i)=>{if(colDia[i]&&c&&!isSoroll(c))diaActFranja[colDia[i]]=[c];});
        } else if(franjaActual){
          cells.forEach((c,i)=>{if(colDia[i]&&c&&!isSoroll(c)){if(!diaActFranja[colDia[i]])diaActFranja[colDia[i]]=[];diaActFranja[colDia[i]].push(c);}});
        }
      }
      if(franjaActual){
        for(const[dia,actes]of Object.entries(diaActFranja)){
          if(!m[nom][dia])m[nom][dia]={};
          if(actes.length===1)m[nom][dia][franjaActual]=actes[0];
          else if(actes.length>1)m[nom][dia][franjaActual]="DOBLE:"+actes.join(" / ");
        }
      }
      continue;
    }
    const nom=lines[0].trim().toUpperCase();
    if(!nom||nom.length<2)continue;
    if(m[nom])continue;
    m[nom]={};
    for(let i=1;i<lines.length;i++){
      const line=lines[i].trim();
      const dia=DIES.find(d=>line.startsWith(d));
      if(!dia)continue;
      const after=line.slice(dia.length).replace(/^:/,"").trim();
      if(!m[nom][dia])m[nom][dia]={};
      for(const slot of after.split("|").map(s=>s.trim())){
        const fids=[...franges].map(f=>f.id).sort((a,b)=>b.length-a.length);
        const f=fids.find(f=>slot.startsWith(f));
        if(f)m[nom][dia][f]=slot.slice(f.length).trim();
      }
    }
  }
  return m;
}

function normalitza(s){return s.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
const NO_CAL_KW=["T.P.","TP.","T.P ","TREBALL PERSONAL","CAEI","ESBARJO","SUPORT","COORDINACIÓ","COORDINACIO","REUNIÓ","REUNIO","CÀRREC","CARREC","DOBLE:"];
const NO_DISP_KW=["CAEI","ESBARJO","PISCINA","COORDINACIÓ","COORDINACIO","REUNIÓ","REUNIO","CÀRREC","CARREC","DOBLE:"];
const TP_KW=["T.P.","TP.","T.P ","TREBALL PERSONAL"];
function calSuplir(act){if(!act)return false;const u=normalitza(act);if(u==="PISCINA")return true;return!NO_CAL_KW.some(k=>u===normalitza(k)||u.startsWith(normalitza(k)));}
function tipusSuplent(act){
  if(!act)return"LLIURE";const u=normalitza(act);
  if(u.startsWith("DOBLE:"))return"NO_DISPONIBLE";
  if(NO_DISP_KW.some(k=>u===normalitza(k)||u.startsWith(normalitza(k))))return"NO_DISPONIBLE";
  if(TP_KW.some(k=>u===normalitza(k)||u.startsWith(normalitza(k))))return"TP";
  if(act.includes("+")||act.includes("*"))return"SUPORT_NATURAL";
  if(u.startsWith("SUPORT"))return"SUPORT_GENERAL";
  return"CLASSE";
}
function actLabel(act){if(!act)return"—";if(normalitza(act).startsWith("DOBLE:"))return act.slice(6)+" (doble)";return act;}
function cercaBase(mestres,absent,dia,franja,ocupats=new Set()){
  const au=absent.toUpperCase();
  const actAbsent=mestres[au]?.[dia]?.[franja]||"";
  if(!calSuplir(actAbsent))return[{nom:null,p:-1,motiu:"No cal — tenia "+actLabel(actAbsent)}];
  const plusMatch=actAbsent.match(/[+*]([A-ZÀ-Úa-zàáâäãèéêëìíîïòóôöõùúûüçñ]+)/i);
  const naturalNom=plusMatch?plusMatch[1].toUpperCase():null;
  const p1=[],p2=[],p3=[];
  for(const[nom,horari]of Object.entries(mestres)){
    if(nom===au||ocupats.has(nom))continue;
    const act=horari?.[dia]?.[franja]||"";
    const tipus=tipusSuplent(act);
    if(naturalNom&&nom.startsWith(naturalNom)){p1.push({nom,act,p:1,motiu:"Suport natural"});continue;}
    if(tipus==="NO_DISPONIBLE"||tipus==="CLASSE"||tipus==="LLIURE")continue;
    if(tipus==="SUPORT_GENERAL"||tipus==="SUPORT_NATURAL"){p2.push({nom,act,p:2,motiu:"Fa suport"});continue;}
    if(tipus==="TP")p3.push({nom,act,p:3,motiu:"⚠ Trenca T.P."});
  }
  const ord=(a,b)=>a.nom.localeCompare(b.nom);
  return[...p1.sort(ord),...p2.sort(ord),...p3.sort(ord)];
}
function assignacioMultiple(mestres,totsAbsents,dia,franjesSeleccionades,absentPerFranja,frangesConfig=FRANGES_DEFAULT){
  const resultat={};
  const franjesOrdenades=[...franjesSeleccionades].sort((a,b)=>frangesConfig.findIndex(f=>f.id===a)-frangesConfig.findIndex(f=>f.id===b));
  const continuitat=new Map();
  for(const franja of franjesOrdenades){
    const absentsAqui=absentPerFranja?.[franja]||[];
    if(!absentsAqui.length)continue;
    const ocupats=new Set(totsAbsents.map(a=>a.toUpperCase()));
    const assignacions=[];
    const ambInfo=absentsAqui.map(absent=>{
      const au=absent.toUpperCase();
      const actAbsent=mestres[au]?.[dia]?.[franja]||"";
      const cal=calSuplir(actAbsent);
      const candidats=cal?cercaBase(mestres,absent,dia,franja,new Set()).filter(c=>c.nom):[];
      return{absent,au,actAbsent,cal,candidats};
    });
    for(const{absent,actAbsent}of ambInfo.filter(a=>!a.cal)){
      assignacions.push({absent,suplent:null,act:actAbsent,p:-1,motiu:"No cal — tenia "+actLabel(actAbsent)});
    }
    const calList=ambInfo.filter(a=>a.cal);
    const assignatsCont=new Set();
    for(const{absent,au}of calList){
      const prev=continuitat.get(au);
      if(!prev||ocupats.has(prev))continue;
      const actPrev=mestres[prev]?.[dia]?.[franja]||"";
      const tipus=tipusSuplent(actPrev);
      if(tipus==="SUPORT_GENERAL"||tipus==="SUPORT_NATURAL"){
        ocupats.add(prev);assignatsCont.add(au);continuitat.set(au,prev);
        assignacions.push({absent,suplent:prev,act:actPrev,p:2,motiu:"Continuïtat"});
      }
    }
    const resta=calList.filter(a=>!assignatsCont.has(a.au)).sort((a,b)=>a.candidats.length-b.candidats.length);
    for(const{absent,au,candidats}of resta){
      const disp=candidats.filter(c=>!ocupats.has(c.nom));
      if(disp.length>0){
        const millor=disp[0];ocupats.add(millor.nom);continuitat.set(au,millor.nom);
        assignacions.push({absent,suplent:millor.nom,act:millor.act,p:millor.p,motiu:millor.motiu});
      } else {
        assignacions.push({absent,suplent:null,act:"",p:0,motiu:"⚠ Sense suplent disponible"});
      }
    }
    resultat[franja]=assignacions;
  }
  return resultat;
}

const cap=s=>s?s.charAt(0)+s.slice(1).toLowerCase():"";
const avuiDia=()=>{const d=new Date().getDay();return DIES[d===0||d===6?0:d-1];};
const P_CFG={"-1":{bg:"#f8fafc",border:"#e2e8f0",pill:"#94a3b8"},"0":{bg:"#fef2f2",border:"#fca5a5",pill:"#ef4444"},"1":{bg:"#f0fdf4",border:"#4ade80",pill:"#22c55e"},"2":{bg:"#fffbeb",border:"#fbbf24",pill:"#f59e0b"},"3":{bg:"#fef2f2",border:"#fca5a5",pill:"#ef4444"}};
const P_LABELS={"-1":"No cal","0":"Sense suplent","1":"P1 Suport Natural","2":"P2 Suport/Co-doc.","3":"P3 Últim recurs"};

let state={page:"cercar",loggedIn:false,user:null,mestres:{},franges:FRANGES_DEFAULT,fitxersCarregats:[],driveUrl:"",driveEstat:null,driveMsg:"",isLoadingDrive:false,registre:[],diaC:avuiDia(),absentsAmbFranges:[],resultatsMultiple:null,canvisManuals:{},diaAvui:avuiDia(),subpaginaAvui:"suplencies",criterisText:"",criterisGuardats:false};
function setState(patch){Object.assign(state,patch);render();}

function initGoogleLogin(){
  if(!window.google){setTimeout(initGoogleLogin,500);return;}
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleCredentialResponse,auto_select:false,cancel_on_tap_outside:false});
  if(!state.loggedIn)render();
}
function handleCredentialResponse(response){
  const payload=parseJwt(response.credential);
  currentUser={email:payload.email,name:payload.name,picture:payload.picture,accessToken:null};
  loadUserData();
  setState({loggedIn:true,user:currentUser});
}
function parseJwt(token){const base64=token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(atob(base64));}
function loginWithGoogle(){
  if(!window.google){alert("Google no carregat, torna-ho a intentar.");return;}
  google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:"email profile https://www.googleapis.com/auth/drive.readonly",
    callback:(tokenResponse)=>{
      if(tokenResponse.access_token){
        currentUser={...currentUser,accessToken:tokenResponse.access_token};
        state.user=currentUser;
        sSet("accessToken",tokenResponse.access_token);
        render();
      }
    },
  }).requestAccessToken();
}
function logout(){if(window.google)google.accounts.id.disableAutoSelect();currentUser=null;setState({loggedIn:false,user:null,mestres:{},registre:[],resultatsMultiple:null,criterisText:"",criterisGuardats:false});}
function loadUserData(){
  const h=sGet("horaris");const r=sGet("registre");const cr=sGet("criteris");const at=sGet("accessToken");
  if(h?.text){state.mestres=parseHoraris(h.text,state.franges);}
  if(r?.llista)state.registre=r.llista;
  if(cr?.text){state.criterisText=cr.text;state.criterisGuardats=true;}
  if(at&&currentUser)currentUser.accessToken=at;
}

async function renovarToken(){
  return new Promise((resolve,reject)=>{
    if(!window.google){reject(new Error("Google no carregat"));return;}
    google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:"email profile https://www.googleapis.com/auth/drive.readonly",
      callback:(tokenResponse)=>{
        if(tokenResponse.access_token){
          currentUser={...currentUser,accessToken:tokenResponse.access_token};
          state.user=currentUser;
          sSet("accessToken",tokenResponse.access_token);
          resolve(tokenResponse.access_token);
        } else {
          reject(new Error("No s'ha pogut renovar el token"));
        }
      },
    }).requestAccessToken({prompt:""});
  });
}

async function importarDrive(){
  if(!currentUser?.accessToken){loginWithGoogle();return;}
  const folderId=extractFolderId(state.driveUrl);
  if(!folderId){setState({driveEstat:"error",driveMsg:"Enllaç no reconegut."});return;}
  setState({isLoadingDrive:true,driveEstat:null,driveMsg:""});
  try{
    let token=currentUser.accessToken;
    // Prova primer, si 401 renova automàticament
    let files;
    try{
      files=await listDriveFolder(folderId,token);
    } catch(e){
      if(e.message.includes("401")){
        token=await renovarToken();
        files=await listDriveFolder(folderId,token);
      } else throw e;
    }
    const supported=files.filter(f=>f.mimeType==="application/vnd.google-apps.document"||f.name?.endsWith(".txt"));
    if(!supported.length)throw new Error("No s'han trobat documents a la carpeta.");
    let allText="";const fitxersCarregats=[];
    for(const f of supported){
      try{const text=await downloadDriveFile(f.id,token,f.mimeType);allText+="\n\n"+text;fitxersCarregats.push({nom:f.name,ok:true});}
      catch(e){fitxersCarregats.push({nom:f.name,ok:false,err:e.message});}
    }
    const parsed=parseHoraris(allText.trim(),state.franges);
    const n=Object.keys(parsed).length;
    if(!n)throw new Error("No s'ha pogut llegir cap mestre dels documents.");
    const mestres={...state.mestres,...parsed};
    sSet("horaris",{text:serializeMestres(mestres)});
    setState({mestres,fitxersCarregats,driveEstat:"ok",driveMsg:n+" mestres importats correctament!",isLoadingDrive:false});
  }catch(e){setState({driveEstat:"error",driveMsg:e.message,isLoadingDrive:false});}
}
function serializeMestres(mestres){
  return Object.entries(mestres).map(([nom,horari])=>{
    const lines=[nom];
    for(const dia of DIES){if(!horari[dia])continue;const slots=Object.entries(horari[dia]).map(([f,a])=>f+" "+a).join(" | ");if(slots)lines.push(dia+": "+slots);}
    return lines.join("\n");
  }).join("\n\n");
}

  const root=document.getElementById("root");
  root.innerHTML=buildHTML();
  if(!state.loggedIn&&window.google){
    setTimeout(()=>{
      const btn=document.getElementById("g-signin-btn");
      if(btn)google.accounts.id.renderButton(btn,{type:"standard",shape:"pill",theme:"outline",text:"signin_with",size:"large",locale:"ca"});
    },100);
  }
}
function buildHTML(){
  if(!state.loggedIn)return buildLoginPage();
  return'<div style="font-family:\'Segoe UI\',system-ui,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;">'+buildHeader()+buildNav()+'<div style="flex:1;overflow:auto;">'+(state.page==="cercar"?buildCercar():"")+(state.page==="avui"?buildAvui():"")+(state.page==="criteris"?buildCriteris():"")+(state.page==="horaris"?buildHoraris():"")+' </div></div>';
}

  const googleCarregat=!!window.google;
  return'<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:#f8fafc;"><div style="background:white;border-radius:1.5rem;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center;"><div style="width:64px;height:64px;background:#2563eb;border-radius:1rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:1.5rem;font-weight:900;color:white;">S</div><h1 style="font-size:1.4rem;font-weight:700;color:#1e293b;margin-bottom:0.5rem;">Cobrir Suplències</h1><p style="color:#64748b;font-size:0.875rem;margin-bottom:2rem;line-height:1.5;">Entra amb el compte de l\'escola per accedir als horaris del teu centre.</p>'

}
function buildCriteris(){
  return'<div style="padding:1rem;display:flex;flex-direction:column;gap:1rem;"><div style="background:white;border-radius:1rem;border:1px solid #e2e8f0;overflow:hidden;"><div style="padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;"><div><h2 style="font-weight:700;color:#1e293b;">Criteris de suplència</h2><p style="font-size:0.75rem;color:#94a3b8;margin-top:0.125rem;">Regles de la teva escola</p></div>'+(state.criterisGuardats?'<span style="background:#dcfce7;color:#166534;font-size:0.7rem;font-weight:700;padding:0.25rem 0.625rem;border-radius:9999px;">✓ Actius</span>':"")+' </div><div style="padding:1.25rem;display:flex;flex-direction:column;gap:1rem;"><textarea id="criteris-input" rows="7" placeholder="Exemple:&#10;1. Els mestres de suport ja assignats a l\'aula tenen prioritat.&#10;2. Després, els que fan suport en una altra aula.&#10;3. L\'equip directiu supleix en últim lloc." style="width:100%;border:1px solid #e2e8f0;border-radius:0.75rem;padding:0.875rem;font-size:0.875rem;color:#374151;resize:none;background:#f8fafc;line-height:1.6;">'+state.criterisText+'</textarea><button onclick="guardarCriteris()" style="width:100%;background:#2563eb;color:white;font-weight:700;padding:0.75rem;border-radius:0.75rem;border:none;cursor:pointer;font-size:0.9rem;">⚙️ Guardar criteris</button></div></div><div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:1rem;padding:1rem;"><p style="font-size:0.75rem;color:#64748b;line-height:1.6;"><strong>ℹ️ Criteris per defecte actius:</strong><br>P1: Mestre que ja era a l\'aula com a suport (+Nom).<br>P2: Mestre que fa suport en una altra aula.<br>P3: Mestre amb T.P. (últim recurs).</p></div></div>';
}
function buildHoraris(){
  const nomsMestres=Object.keys(state.mestres).sort();
  const hasToken=!!currentUser?.accessToken;
  return'<div style="padding:1rem;display:flex;flex-direction:column;gap:1rem;"><div style="background:white;border-radius:1rem;border:1px solid #e2e8f0;overflow:hidden;"><div style="padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;"><div><h2 style="font-weight:700;color:#1e293b;">Importar des de Drive</h2><p style="font-size:0.75rem;color:#94a3b8;margin-top:0.125rem;">Carpeta amb els horaris de l\'escola</p></div>'+(nomsMestres.length>0?'<span style="background:#dcfce7;color:#166534;font-size:0.7rem;font-weight:700;padding:0.25rem 0.625rem;border-radius:9999px;">'+nomsMestres.length+' mestres</span>':"")+' </div><div style="padding:1.25rem;display:flex;flex-direction:column;gap:0.875rem;">'
  +(!hasToken?'<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:0.75rem;padding:0.875rem;"><p style="font-size:0.875rem;color:#1d4ed8;font-weight:600;margin-bottom:0.5rem;">Cal permís per llegir Drive</p><p style="font-size:0.75rem;color:#3b82f6;margin-bottom:0.75rem;">Clica el botó per autoritzar l\'accés a la teva carpeta.</p><button onclick="loginWithGoogle()" style="width:100%;background:#2563eb;color:white;font-weight:700;padding:0.625rem;border-radius:0.625rem;border:none;cursor:pointer;font-size:0.875rem;">🔑 Autoritzar Google Drive</button></div>':"")
  +'<div><label style="font-size:0.7rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.375rem;">URL de la carpeta</label><input id="drive-url" type="url" value="'+state.driveUrl+'" placeholder="https://drive.google.com/drive/folders/..." style="width:100%;border:1px solid #e2e8f0;border-radius:0.75rem;padding:0.625rem 0.875rem;font-size:0.875rem;color:#374151;background:#f8fafc;margin-bottom:0.5rem;"><button onclick="importarDriveAction()" '+(state.isLoadingDrive?"disabled":"")+' style="width:100%;background:'+(hasToken?"#2563eb":"#94a3b8")+';color:white;font-weight:700;padding:0.75rem;border-radius:0.75rem;border:none;cursor:'+(hasToken?"pointer":"default")+';font-size:0.875rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;">'+(state.isLoadingDrive?'<div style="width:1rem;height:1rem;border:2px solid white;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div> Llegint...':"📁 Importar carpeta Drive")+'</button></div>'
  +(state.driveEstat==="ok"?'<p style="font-size:0.75rem;color:#16a34a;font-weight:600;">✓ '+state.driveMsg+'</p>':"")
  +(state.driveEstat==="error"?'<p style="font-size:0.75rem;color:#dc2626;">⚠ '+state.driveMsg+'</p>':"")
  +(state.fitxersCarregats.length>0?'<div style="display:flex;flex-direction:column;gap:0.375rem;">'+state.fitxersCarregats.map(f=>'<div style="display:flex;align-items:center;gap:0.5rem;border-radius:0.5rem;padding:0.5rem 0.75rem;font-size:0.75rem;background:'+(f.ok?"#f0fdf4":"#fef2f2")+';border:1px solid '+(f.ok?"#bbf7d0":"#fecaca")+';">'+(f.ok?"✅":"❌")+'<span style="color:'+(f.ok?"#374151":"#dc2626")+';font-weight:500;flex:1;">'+f.nom+'</span></div>').join("")+'</div>':"")
  +'</div></div>'
  +'<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:0.75rem;padding:0.875rem;"><p style="font-size:0.75rem;color:#92400e;line-height:1.6;"><strong>💡 Format recomanat:</strong> Google Docs (no .docx). Cada document ha de tenir el nom del mestre i una taula amb els dies de la setmana a la capçalera.</p></div>'
  +(nomsMestres.length>0?'<div style="background:white;border-radius:1rem;border:1px solid #e2e8f0;overflow:hidden;"><div style="padding:0.875rem 1.25rem;border-bottom:1px solid #f1f5f9;"><h3 style="font-weight:700;color:#374151;font-size:0.875rem;">Mestres carregats ('+nomsMestres.length+')</h3></div><div style="padding:1rem;display:flex;flex-wrap:wrap;gap:0.5rem;">'+nomsMestres.map(nom=>'<div style="display:flex;align-items:center;gap:0.375rem;background:#f8fafc;border:1px solid #e2e8f0;border-radius:0.75rem;padding:0.375rem 0.75rem;"><div style="width:0.375rem;height:0.375rem;border-radius:50%;background:#22c55e;"></div><span style="font-size:0.75rem;font-weight:600;color:#374151;">'+cap(nom)+'</span></div>').join("")+'</div><div style="padding:0.75rem 1.25rem;border-top:1px solid #f1f5f9;"><button onclick="esborrarHoraris()" style="font-size:0.75rem;color:#94a3b8;background:none;border:none;cursor:pointer;">Esborrar tots els horaris</button></div></div>':"")
  +'<style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>';
}

window.setPage=p=>setState({page:p});
window.setSubpagina=p=>setState({subpaginaAvui:p});
window.setDia=d=>setState({diaC:d,resultatsMultiple:null,canvisManuals:{}});
window.setDiaAvui=d=>setState({diaAvui:d});
window.afegirAbsent=nom=>{if(!nom||state.absentsAmbFranges.find(a=>a.nom===nom))return;setState({absentsAmbFranges:[...state.absentsAmbFranges,{nom,franges:[]}],resultatsMultiple:null,canvisManuals:{}});};
window.eliminarAbsent=nom=>setState({absentsAmbFranges:state.absentsAmbFranges.filter(a=>a.nom!==nom),resultatsMultiple:null,canvisManuals:{}});
window.toggleFranja=(nom,franja)=>setState({absentsAmbFranges:state.absentsAmbFranges.map(a=>a.nom!==nom?a:{...a,franges:a.franges.includes(franja)?a.franges.filter(f=>f!==franja):[...a.franges,franja]}),resultatsMultiple:null,canvisManuals:{}});
window.marcarTotElDia=nom=>setState({absentsAmbFranges:state.absentsAmbFranges.map(a=>a.nom===nom?{...a,franges:[...state.franges.map(f=>f.id)]}:a),resultatsMultiple:null,canvisManuals:{}});
window.setCanviManual=(clau,val)=>{state.canvisManuals={...state.canvisManuals,[clau]:val||null};};
window.handleCerca=()=>{
  const absentPerFranja={};
  for(const{nom,franges:fs}of state.absentsAmbFranges)for(const f of fs){if(!absentPerFranja[f])absentPerFranja[f]=[];absentPerFranja[f].push(nom);}
  const totsAbsents=state.absentsAmbFranges.map(a=>a.nom);
  setState({resultatsMultiple:assignacioMultiple(state.mestres,totsAbsents,state.diaC,Object.keys(absentPerFranja),absentPerFranja,state.franges),canvisManuals:{}});
};
window.assignarUn=(franja,absent)=>{
  const clau=franja+"__"+absent;
  const a=state.resultatsMultiple?.[franja]?.find(x=>x.absent===absent);
  if(!a)return;
  const suplentFinal=state.canvisManuals[clau]||a.suplent;
  if(!suplentFinal)return;
  const nou={id:Date.now()+Math.random(),absent,suplent:suplentFinal,dia:state.diaC,franja,prioritat:a.p,motiu:a.motiu,ts:new Date().toLocaleTimeString("ca",{hour:"2-digit",minute:"2-digit"})};
  const novaLlista=[nou,...state.registre];
  sSet("registre",{llista:novaLlista});
  setState({registre:novaLlista});
};
window.assignarTot=()=>{
  if(!state.resultatsMultiple)return;
  const noves=[];
  for(const[franja,assignacions]of Object.entries(state.resultatsMultiple)){
    for(const a of assignacions){
      if(a.p===-1)continue;
      const clau=franja+"__"+a.absent;
      const sf=state.canvisManuals[clau]||a.suplent;
      if(!sf)continue;
      noves.push({id:Date.now()+Math.random(),absent:a.absent,suplent:sf,dia:state.diaC,franja,prioritat:a.p,motiu:a.motiu,ts:new Date().toLocaleTimeString("ca",{hour:"2-digit",minute:"2-digit"})});
    }
  }
  const novaLlista=[...noves,...state.registre];
  sSet("registre",{llista:novaLlista});
  setState({registre:novaLlista});
};
window.eliminarRegistre=id=>{const novaLlista=state.registre.filter(r=>r.id!==id);sSet("registre",{llista:novaLlista});setState({registre:novaLlista});};
window.guardarCriteris=()=>{const text=document.getElementById("criteris-input")?.value||"";sSet("criteris",{text});setState({criterisText:text,criterisGuardats:true});};
window.importarDriveAction=()=>{const url=document.getElementById("drive-url")?.value||"";state.driveUrl=url;importarDrive();};
window.esborrarHoraris=()=>{if(!confirm("Segur que vols esborrar tots els horaris?"))return;sSet("horaris",{text:""});setState({mestres:{},fitxersCarregats:[]});};
window.logout=logout;
window.loginWithGoogle=loginWithGoogle;

initGoogleLogin();
render();
</script>
</body>
</html>

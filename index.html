const DIES = ["Dilluns", "Dimarts", "Dimecres", "Dijous", "Divendres"];

// ─── CODIFICACIÓ (privacitat) ─────────────────────────────────────────────────
function buildCodeMap(m) {
  const noms = Object.keys(m).sort();
  const codeMap = {},
    decodeMap = {};
  noms.forEach((n, i) => {
    const c = `M${String(i + 1).padStart(2, "0")}`;
    codeMap[n] = c;
    decodeMap[c] = n;
  });
  return {
    codeMap,
    decodeMap
  };
}
function encodeText(text, codeMap) {
  let r = text;
  Object.entries(codeMap).sort((a, b) => b[0].length - a[0].length).forEach(([n, c]) => {
    r = r.split(n).join(c);
    r = r.split(n.charAt(0) + n.slice(1).toLowerCase()).join(c);
  });
  return r;
}
function decodeText(text, decodeMap) {
  let r = text;
  Object.entries(decodeMap).forEach(([c, n]) => {
    r = r.split(c).join(cap(n));
  });
  return r;
}

// ─── PARSER ──────────────────────────────────────────────────────────────────
const isTableRow = l => l.trim().startsWith("|");
const cleanCell = s => s.replace(/\\\*/g, "*").replace(/\\/g, "").trim();
function canonFranja(s, franges) {
  const t = s.replace(/\s/g, "");
  // Intentem fer matching amb les franges configurades
  for (const f of franges) {
    const inici = f.inici.replace(":", "").replace(/^0/, "");
    if (t.startsWith(f.inici.replace(":", ":")) || t.startsWith(inici)) return f.id;
  }
  // Fallback hardcoded
  if (t.startsWith("9-10") || t.startsWith("9–10")) return "9h";
  if (t.startsWith("10-11") || t.startsWith("10–11")) return "10h";
  if (t.startsWith("11:30") || t.startsWith("11.30")) return "11:30h";
  if (t.startsWith("14:30") || t.startsWith("14.30")) return "14:30h";
  if (t.startsWith("15:15") || t.startsWith("15.15")) return "15:15h";
  return null;
}
const SOROLL = ["ESBARJO", "ESPAI MIGDIA", "CLAUSTRES", "COMISSIONS", "FORMACIÓ", "PERFER", "PER FER", "REUNIONS", ":-:", "16:0", "17H", "8:30"];
function isSoroll(s) {
  const u = s.toUpperCase().replace(/\s/g, "");
  return SOROLL.some(k => u.includes(k.replace(/\s/g, "")));
}
function parseHoraris(text, franges = FRANGES_DEFAULT) {
  const m = {};
  const blocks = text.trim().split(/\n\s*\n/);
  for (const block of blocks) {
    const lines = block.trim().split("\n").filter(Boolean);
    if (!lines.length) continue;
    const tableLines = lines.filter(l => isTableRow(l));
    if (tableLines.length >= 3) {
      const nomLine = lines.find(l => !isTableRow(l) && l.trim().length > 2) || "";
      const nomMatch = nomLine.match(/([A-ZÀÁÂÄÃÈÉÊËÌÍÎÏÒÓÔÖÕÙÚÛÜÇÑ][a-zàáâäãèéêëìíîïòóôöõùúûüçñ]+(?:\s+[A-ZÀÁÂÄÃÈÉÊËÌÍÎÏÒÓÔÖÕÙÚÛÜÇÑ][a-zàáâäãèéêëìíîïòóôöõùúûüçñ]+)+)/);
      if (!nomMatch) continue;
      const nom = nomMatch[1].toUpperCase();
      if (m[nom]) continue;
      m[nom] = {};
      const headerIdx = tableLines.findIndex(l => {
        const upper = l.toUpperCase();
        return upper.includes("DILLUNS") || upper.includes("DIMARTS");
      });
      if (headerIdx < 0) continue;
      const headerCells = tableLines[headerIdx].split("|").map(cleanCell);
      const colDia = {};
      headerCells.forEach((c, i) => {
        const d = DIES.find(dia => c.toUpperCase().includes(dia.toUpperCase()));
        if (d) colDia[i] = d;
      });
      let franjaActual = null;
      const diaActFranja = {};
      const dataLines = tableLines.slice(headerIdx + 2);
      for (const row of dataLines) {
        if (isSoroll(row)) continue;
        const cells = row.split("|").map(cleanCell);
        const col0 = cells[0] || "";
        const franja = canonFranja(col0, franges);
        if (franja) {
          if (franjaActual) {
            for (const [dia, actes] of Object.entries(diaActFranja)) {
              if (!m[nom][dia]) m[nom][dia] = {};
              if (actes.length === 1) m[nom][dia][franjaActual] = actes[0];else if (actes.length > 1) m[nom][dia][franjaActual] = "DOBLE:" + actes.join(" / ");
            }
          }
          franjaActual = franja;
          Object.keys(colDia).forEach(i => {
            diaActFranja[colDia[i]] = [];
          });
          cells.forEach((c, i) => {
            if (colDia[i] && c && !isSoroll(c)) diaActFranja[colDia[i]] = [c];
          });
        } else if (franjaActual) {
          cells.forEach((c, i) => {
            if (colDia[i] && c && !isSoroll(c)) {
              if (!diaActFranja[colDia[i]]) diaActFranja[colDia[i]] = [];
              diaActFranja[colDia[i]].push(c);
            }
          });
        }
      }
      if (franjaActual) {
        for (const [dia, actes] of Object.entries(diaActFranja)) {
          if (!m[nom][dia]) m[nom][dia] = {};
          if (actes.length === 1) m[nom][dia][franjaActual] = actes[0];else if (actes.length > 1) m[nom][dia][franjaActual] = "DOBLE:" + actes.join(" / ");
        }
      }
      continue;
    }
    // Format text pla
    const nom = lines[0].trim().toUpperCase();
    if (!nom || nom.length < 2) continue;
    if (m[nom]) continue;
    m[nom] = {};
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      const dia = DIES.find(d => line.startsWith(d));
      if (!dia) continue;
      const after = line.slice(dia.length).replace(/^:/, "").trim();
      if (!m[nom][dia]) m[nom][dia] = {};

        const franjaIds = [...franges].map(f => f.id).sort((a, b) => b.length - a.length);

// ─── CLASSIFICACIÓ (regles definitives) ──────────────────────────────────────
//
// NO CAL SUPLIR si l'absent tenia:
//   T.P. / T.P. Nivell / CAEI / Esbarjo / Suport / +Nom / Coordinació / Reunió / Càrrec
//   (Piscina SÍ cal suplir — la classe queda sola)
//
// POT SUPLIR si el suplent té:
//   P1: consta com +Nom a l'horari de l'absent (ja era dins l'aula)
//   P2: té "Suport a X" explícit (sense +Nom propi) — es sacrifica un suport
//   P3 (últim recurs): té T.P. o T.P. Nivell
//
// NO DISPONIBLE per suplir si el suplent té:
//   Classe normal / CAEI / Esbarjo / Coordinació / Reunió / Càrrec / Doble activitat / Piscina

function normalitza(s) {
  return s.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

// Paraules clau que fan que l'ABSENT no necessiti suplència
const NO_CAL_SUPLIR_KW = ["T.P.", "TP.", "T.P ", "TREBALL PERSONAL", "CAEI", "ESBARJO", "SUPORT",
// l'absent ja té suport → cobert
"COORDINACIÓ", "COORDINACIO", "REUNIÓ", "REUNIO", "CÀRREC", "CARREC", "TASQUES CAP", "ENGLISH LAB", "DOBLE:"];

// Paraules clau que fan que el SUPLENT no estigui disponible (ni com a últim recurs)
const NO_DISPONIBLE_KW = ["CAEI", "ESBARJO", "PISCINA", "COORDINACIÓ", "COORDINACIO", "REUNIÓ", "REUNIO", "CÀRREC", "CARREC", "TASQUES CAP", "DOBLE:"];

// Paraules clau per T.P. (últim recurs)
const TP_KW = ["T.P.", "TP.", "T.P ", "TREBALL PERSONAL"];
function calSuplir(actAbsent) {
  if (!actAbsent) return false;
  const u = normalitza(actAbsent);
  // Piscina SÍ cal suplir
  if (u === "PISCINA") return true;
  // La resta de paraules clau → no cal suplir
  if (NO_CAL_SUPLIR_KW.some(k => u === normalitza(k) || u.startsWith(normalitza(k)))) return false;
  // Si té +Nom → ja té suport dins l'aula → no cal suplir
  // (la persona del +Nom és qui supleix, gestionat per cercaBase)
  // PERÒ: calSuplir retorna true perquè cal assignar el +Nom com a suplent
  return true;
}

// Retorna el "tipus" d'activitat d'un SUPLENT potencial
function tipusSuplent(act) {
  if (!act) return "LLIURE";
  const u = normalitza(act);
  if (u.startsWith("DOBLE:")) return "NO_DISPONIBLE";
  if (NO_DISPONIBLE_KW.some(k => u === normalitza(k) || u.startsWith(normalitza(k)))) return "NO_DISPONIBLE";
  if (TP_KW.some(k => u === normalitza(k) || u.startsWith(normalitza(k)))) return "TP";
  // +Nom o *Nom → fa suport en una altra aula
  if (act.includes("+") || act.includes("*")) return "SUPORT_NATURAL";
  // "Suport a X" sense +Nom → suport general
  if (u.startsWith("SUPORT")) return "SUPORT_GENERAL";
  // Classe normal → no disponible
  return "CLASSE";
}
function actLabel(act) {
  if (!act) return "—";
  if (normalitza(act).startsWith("DOBLE:")) return act.slice(6) + " (doble activitat)";
  return act;
}

// ─── ALGORISME ────────────────────────────────────────────────────────────────
function cercaBase(mestres, absent, dia, franja, ocupats = new Set(), reglesJSON = null) {
  const au = absent.toUpperCase();
  const actAbsent = mestres[au]?.[dia]?.[franja] || "";

  // Comprova si cal suplir
  if (!calSuplir(actAbsent)) {
    return [{
      nom: null,
      p: -1,
      motiu: `No cal suplir — tenia ${actLabel(actAbsent)}`
    }];
  }

  // Busquem +Nom a l'activitat de l'absent → suport natural P1
  const plusMatch = actAbsent.match(/[+*]([A-ZÀ-Úa-zàáâäãèéêëìíîïòóôöõùúûüçñ]+)/i);
  const naturalNom = plusMatch ? plusMatch[1].toUpperCase() : null;
  const p1 = [],
    p2 = [],
    p3 = [];
  for (const [nom, horari] of Object.entries(mestres)) {
    if (nom === au || ocupats.has(nom)) continue;
    const act = horari?.[dia]?.[franja] || "";
    const tipus = tipusSuplent(act);

    // P1: és el +Nom que consta a l'horari de l'absent (prioritat absoluta)
    if (naturalNom && nom.startsWith(naturalNom)) {
      p1.push({
        nom,
        act,
        p: 1,
        score: 1,
        motiu: `Suport natural — ja era dins l'aula de ${cap(absent)}`
      });
      continue;
    }

    // No disponible ni com a últim recurs
    if (tipus === "NO_DISPONIBLE" || tipus === "CLASSE" || tipus === "LLIURE") continue;

    // P2: fa suport en una altra aula (SUPORT_GENERAL o SUPORT_NATURAL d'una altra aula)
    if (tipus === "SUPORT_GENERAL" || tipus === "SUPORT_NATURAL") {

function assignacioMultiple(mestres, totsAbsents, dia, franjesSeleccionades, continuitat = new Map(), absentPerFranja = null, frangesConfig = FRANGES_DEFAULT, reglesJSON = null) {

  for (const franja of franjesOrdenades) {
    const absentsAquestFranja = absentPerFranja ? absentPerFranja[franja] || [] : totsAbsents;
    if (!absentsAquestFranja.length) continue;

    // Ocupats = tots els absents (no poden suplir-se a si mateixos)
    const ocupats = new Set(totsAbsents.map(a => a.toUpperCase()));
    const assignacions = [];
    const absentsAmbInfo = absentsAquestFranja.map(absent => {
      const au = absent.toUpperCase();
      const actAbsent = mestres[au]?.[dia]?.[franja] || "";
      const cal = calSuplir(actAbsent);
      const candidats = cal ? cercaBase(mestres, absent, dia, franja, new Set(), reglesJSON).filter(c => c.nom) : [];
      return {
        absent,
        au,
        actAbsent,
        cal,
        candidats
      };
    });

    // 1. Els que NO cal suplir
    for (const {
      absent,
      actAbsent
    } of absentsAmbInfo.filter(a => !a.cal)) {
      assignacions.push({
        absent,
        suplent: null,
        act: actAbsent,
        p: -1,
        motiu: `No cal suplir — tenia ${actLabel(actAbsent)}`
      });
    }
    const calSuplirLlista = absentsAmbInfo.filter(a => a.cal);
    const assignatsContinuitat = new Set();

    // 2. Continuïtat: el mateix suplent de la franja anterior si segueix disponible com a suport
    for (const {
      absent,
      au
    } of calSuplirLlista) {
      const suplentAnterior = continuitat.get(au);
      if (!suplentAnterior || ocupats.has(suplentAnterior)) continue;
      const actSuplent = mestres[suplentAnterior]?.[dia]?.[franja] || "";
      const tipus = tipusSuplent(actSuplent);
      // Continuïtat només si segueix sent suport (P2) — no si ara té classe o TP
      if (tipus === "SUPORT_GENERAL" || tipus === "SUPORT_NATURAL") {
        ocupats.add(suplentAnterior);
        assignatsContinuitat.add(au);
        continuitat.set(au, suplentAnterior);
        assignacions.push({
          absent,
          suplent: suplentAnterior,
          act: actSuplent,
          p: 2,
          motiu: `Continuïtat — ja cobria ${cap(absent)} a la franja anterior`
        });
      }
    }

    // 3. Resta: ordenats per menys candidats primer (els difícils, primer)
    const resta = calSuplirLlista.filter(a => !assignatsContinuitat.has(a.au)).sort((a, b) => a.candidats.length - b.candidats.length);
    for (const {
      absent,
      au,
      candidats
    } of resta) {
      const disponibles = candidats.filter(c => !ocupats.has(c.nom));
      if (disponibles.length > 0) {
        const millor = disponibles[0];
        ocupats.add(millor.nom);
        continuitat.set(au, millor.nom);
        assignacions.push({
          absent,
          suplent: millor.nom,
          act: millor.act,
          p: millor.p,
          motiu: millor.motiu
        });
      } else {
        assignacions.push({
          absent,
          suplent: null,
          act: "",
          p: 0,
          motiu: "⚠ Sense suplent disponible en aquesta franja"
        });
      }
    }
    resultat[franja] = assignacions;
  }
  return resultat;
}

async function readDocxXML(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = async e => {
      try {
        // Descomprimim el .docx (és un ZIP)
        const JSZip = window.JSZip;
        if (!JSZip) throw new Error("JSZip no disponible");
        const zip = await JSZip.loadAsync(e.target.result);
        const xmlFile = zip.file("word/document.xml");
        if (!xmlFile) throw new Error("No s'ha trobat document.xml");
        const xmlText = await xmlFile.async("text");
        res(xmlText);
      } catch (err) {
        rej(err);
      }
    };
    r.onerror = () => rej(new Error("Error llegint fitxer"));
    r.readAsArrayBuffer(file);
  });
}

// Parser XML de document.xml — llegeix taules dins SDT i taules normals
function parseDocxXML(xmlText, nomMestre, frangesConfig) {
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlText, "text/xml");
  const NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  function getCellText(cell) {
    const texts = cell.getElementsByTagNameNS(NS, "t");
    return Array.from(texts).map(t => t.textContent || "").join("").trim();
  }

  // Busquem totes les taules (tant dins SDT com directes)
  const allTables = xmlDoc.getElementsByTagNameNS(NS, "tbl");
  const horari = {};
  for (const tbl of allTables) {
    const rows = tbl.getElementsByTagNameNS(NS, "tr");
    if (rows.length < 3) continue;

    // Comprovem si la primera fila conté els dies
    const firstRow = rows[0];
    const firstCells = Array.from(firstRow.getElementsByTagNameNS(NS, "tc")).map(c => getCellText(c).toUpperCase());
    const hasDies = firstCells.some(c => c.includes("DILLUNS") || c.includes("DIMARTS"));
    if (!hasDies) continue;

    // Mapem columnes → dies
    const colDia = {};
    firstCells.forEach((c, i) => {
      const dia = DIES.find(d => c.includes(d.toUpperCase()));
      if (dia) colDia[i] = dia;
    });

    // Llegim cada fila de dades
    for (let r = 1; r < rows.length; r++) {
      const cells = Array.from(rows[r].getElementsByTagNameNS(NS, "tc"));
      if (!cells.length) continue;
      const col0 = getCellText(cells[0]);
      const franja = canonFranja(col0, frangesConfig);
      if (!franja) continue;
      cells.forEach((cell, i) => {
        if (!colDia[i]) return;
        const dia = colDia[i];
        const act = getCellText(cell);
        if (!act || isSoroll(act)) return;
        if (!horari[dia]) horari[dia] = {};
        if (!horari[dia][franja]) {
          horari[dia][franja] = act;
        } else {
          // Doble activitat
          horari[dia][franja] = "DOBLE:" + horari[dia][franja] + " / " + act;
        }
      });
    }
  }
  return horari;
}
async function readFile(file) {
  if (file.name.endsWith(".txt")) return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = () => rej(new Error("Error .txt"));
    r.readAsText(file, "UTF-8");
  });
  if (file.name.endsWith(".docx")) {
    // Intentem primer amb XML directe (millor per SDT)
    try {
      await ensureJSZip();
      const xmlText = await readDocxXML(file);
      return {
        tipus: "xml",
        xml: xmlText
      };
    } catch {
      // Fallback a mammoth
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = async e => {
          try {
            await ensureMammoth();
            const result = await window.mammoth.extractRawText({
              arrayBuffer: e.target.result
            });
            res({
              tipus: "text",
              text: result.value
            });
          } catch (err) {
            rej(err);
          }
        };
        r.onerror = () => rej(new Error("Error .docx"));
        r.readAsArrayBuffer(file);
      });
    }
  }
  throw new Error("Format no suportat");
}
async function ensureMammoth() {
  if (window.mammoth) return;
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
    s.onload = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
}
